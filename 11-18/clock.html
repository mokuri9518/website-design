<!DOCTYPE html>
<html>
<head>
    <title>clock</title>
    <script>
        function integerToRoman(num) {
    const romanValues = {
        M: 1000,
        CM: 900,
        D: 500,
        CD: 400,
        C: 100,
        XC: 90,
        L: 50,
        XL: 40,
        X: 10,
        IX: 9,
        V: 5,
        IV: 4,
        I: 1
    };
    let roman = '';
    for (let key in romanValues) {
        while (num >= romanValues[key]) {
            roman += key;
            num -= romanValues[key];
        }
    }
    return roman;
}
    </script>
    <style>
        .colorsec{
            color: #ea574a;
        }
    </style>
</head>
<body>

<canvas id="canvas" width="400" height="600" style="background-color:#333">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let radius = canvas.width / 2;
ctx.translate(radius, radius);
radius = radius * 0.90
setInterval(drawClock, 5000);

function drawClock() {
  drawFace(ctx, radius);
  drawScale(ctx,radius);
  drawNumbers(ctx, radius);
  drawTime(ctx, radius);
}
function drawScale(ctx, radius) {
  ctx.save(); // 保存畫布初始狀態

  for (let num = 0; num < 60; num++) {
    // 一圈 60 格（2 * Math.PI / 60）
    const ang = num * (2 * Math.PI / 60);

    ctx.save();
    ctx.rotate(ang); // 旋轉到對應刻度角度（不轉回來，讓刻度垂直指向圓心）

    if (num % 5 === 0) {
      // 每 5 格（整點位置）：較粗的紅色主刻度
      ctx.fillStyle = "#e63946";
      ctx.fillRect(-1.5, -radius * 0.94, 3, 14);
    } else {
      // 其餘分鐘/秒鐘位置：細小深色刻度
      ctx.fillStyle = "#555555";
      ctx.fillRect(-0.75, -radius * 0.94, 1.5, 8);
    }

    ctx.restore();
  }

  ctx.restore();
}
function drawFace(ctx, radius) {
ctx.fillStyle = '#1b3a6e';
ctx.fillRect(-200, -200, 400, 600);
  const grad = ctx.createRadialGradient(0,0,radius*0.95, 0,0,radius*1.05);
  grad.addColorStop(0, '#d6a323');
  grad.addColorStop(1, '#ea574a');
  grad.addColorStop(1, '#e3a60c');
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, 2*Math.PI);
  ctx.fillStyle = 'white';
  ctx.fill();
  ctx.strokeStyle = grad;
  ctx.lineWidth = radius*0.1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, radius*0.1, 0, 2*Math.PI);
  ctx.fillStyle = '#333';
  ctx.fill();
}

function drawNumbers(ctx, radius) {
  ctx.font = radius*0.15 + "px arial";
  ctx.textBaseline="middle";
  ctx.textAlign="center";
  for(let num = 1; num < 5; num++){
    let ang = num * Math.PI / 2;
    ctx.rotate(ang);
    ctx.translate(0, -radius*0.85);
    ctx.rotate(-ang);
    ctx.fillText(integerToRoman(num*4), 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius*0.85);
    ctx.rotate(-ang);
  }
}

function drawTime(ctx, radius) {
  const now = new Date();
  const rawHour = now.getHours();
  const rawMinute = now.getMinutes();
  const rawSecond = now.getSeconds();

  const h = rawHour % 12;
  const hourAngle = (h * Math.PI / 6) + (rawMinute * Math.PI / (6 * 60)) + (rawSecond * Math.PI / (360 * 60));
  const minuteAngle = (rawMinute * Math.PI / 30) + (rawSecond * Math.PI / (30 * 60));
  const secondAngle = rawSecond * Math.PI / 30;

  drawHand(ctx, hourAngle, radius * 0.5, radius * 0.07);
  drawHand(ctx, minuteAngle, radius * 0.8, radius * 0.05);
  drawHand(ctx, secondAngle, radius * 0.9, radius * 0.02);

  // 中心軸蓋
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.08, 0, 2 * Math.PI);
  ctx.fillStyle = '#2b2d42';
  ctx.fill();

  // 1. 畫紫色背景框（X: -60 ~ +60, Y: 275 ~ 307）
  ctx.fillStyle = "#933eb1";
  ctx.fillRect(-60, 275, 120, 32);

  // 2. 畫時間文字（正中心 X: 0, Y: 291）
  const timeText = 
    String(rawHour).padStart(2, '0') + ':' +
    String(rawMinute).padStart(2, '0') + ':' +
    String(rawSecond).padStart(2, '0');

  ctx.fillStyle = "#eab54a";
  ctx.font = "bold 20px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(timeText, 0, 291);
}

function drawHand(ctx, pos, length, width) {
    ctx.save();
    ctx.rotate(pos);

    // 外層深色金屬輪廓
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#2b2d42";
    ctx.moveTo(0, length * 0.15);
    ctx.lineTo(0, -length);
    ctx.stroke();

    // 內層夜光塗料填色
    ctx.beginPath();
    ctx.lineWidth = width * 0.45;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#a8ff78"; // 經典夜光綠
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -length * 0.92);
    ctx.stroke();

    ctx.restore();
}
</script>

</body>
</html>
