<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-14</title>
    <style>
        .container {
            width: 400px;
            height: 400px;
            position: relative;
            overflow:hidden; 
            
        }
        .container:hover .overlay {
            opacity: 1;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #91AC67;
            transition: 0.5s ease;
            opacity: 0;
            border-radius: 50%;
        }
        .text {
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%,-50%);
            position: absolute;
            top: 80%;
            left: 50%;
            font-size: 300%;
            color: #FCECD8;
        }
        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        </style>
</head>
<body>
    <div class="container">
        <img src="https://www.telegraph.co.uk/content/dam/news/2017/02/27/JS121951058_quokka_trans_NvBQzQNjv4Bqh1nUOO6qQ8PRm2VajjTi9tkDrcV3BLX3J2OU2qLhe68.jpg?imwidth=640"
            alt="A cute quokka" width="100%" class="image">
        <div class ="overlay">
            <div class="text">quokka</div>
        </div>
    </div>
</body>
</html>
